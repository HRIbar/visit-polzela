version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: visitpolzela-db
    environment:
      POSTGRES_DB: visitpolzela
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

