quarkus.application.name=Visit Polzela
quarkus.http.root-path=/

quarkus.http.port=${PORT:8080}

%prod.quarkus.package.jar.type=uber-jar
quarkus.package.jar.type=uber-jar
quarkus.native.container-build=true

# --- Datasource ---
quarkus.datasource.db-kind=postgresql

# Dev profile: local Docker Compose Postgres
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/visitpolzela
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=postgres

# Prod profile: Fly.io managed Postgres (DATABASE_URL injected as secret)
%prod.quarkus.datasource.jdbc.url=jdbc:${DATABASE_URL}

# --- Hibernate ORM ---
quarkus.hibernate-orm.database.generation=none

# --- Flyway ---
quarkus.flyway.migrate-at-start=true

# Static file serving is automatic in Quarkus (META-INF/resources), no config needed.

# CORS:
#   - dev: allows Vite HMR dev server (port 5173)
#   - prod: allows Capacitor Android app (origin https://localhost) and the
#           deployed web app (https://visit-polzela.com).
#           The same-origin web requests still work; only cross-origin callers
#           (Capacitor WebView) need the header.
quarkus.http.cors=true
quarkus.http.cors.origins=https://localhost,https://visit-polzela.com,http://localhost:5173,capacitor://localhost
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,content-type,origin
