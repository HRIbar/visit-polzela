quarkus.application.name=Visit Polzela
quarkus.http.root-path=/

quarkus.http.port=${PORT:8080}

%prod.quarkus.package.jar.type=uber-jar
quarkus.package.jar.type=uber-jar
quarkus.native.container-build=true

# Static file serving is automatic in Quarkus (META-INF/resources), no config needed.

# CORS — dev only: allows Vite HMR dev server (port 5173) to call the API.
# In production the frontend is served from the same origin, so CORS must be OFF
# to avoid 403s on <script type="module" crossorigin> asset requests.
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:5173
%dev.quarkus.http.cors.methods=GET,OPTIONS
%dev.quarkus.http.cors.headers=accept,content-type
